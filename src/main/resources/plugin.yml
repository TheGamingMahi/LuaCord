name: LuaCord
main: io.thegamingmahi.luacord.Main
version: 0.2.5

author: TheGamingMahi
authors: [TheGamingMahi, jammehcow, AL_1, mathhulk]

description: Lua scripting for Minecraft servers with Paper compatibility

api-version: 1.13

commands:
  luacord:
    description: The main command for LuaCord
    usage: /<command> [help|last-error|plugins|reload|resetenv|run]
    permission: luacord.command
    permission-message: You do not have permission to manage LuaCord.

permissions:
  luacord.command:
    description: Give access to the /luacord command.
    default: op
  luacord.run:
    description: Gives access to the /luacord run command. Is not default for ops.
    default: false
    children:
      luacord.command: true
